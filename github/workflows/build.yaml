name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t devops-backend:1.0 ./app/backend

      - name: Build Frontend Image
        run: docker build -t devops-frontend:1.0 ./app/frontend

      - name: Verify Images
        run: docker images